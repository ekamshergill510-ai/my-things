<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🔢 Number Guess</title><style>body{margin:0;background:#0d1117;color:#f0f6fc;font-family:Arial;text-align:center;min-height:100vh;display:grid;place-items:center}.box{width:min(600px,90%);background:#161b22;border:1px solid #30363d;border-radius:20px;padding:35px}button{padding:14px 22px;border:0;border-radius:12px;background:#238636;color:white;font-size:18px;cursor:pointer}button:hover{filter:brightness(1.15)}a{color:#58a6ff;text-decoration:none}#arena{height:280px;border-radius:15px;background:#111827;display:grid;place-items:center;cursor:pointer;margin:20px 0}input{padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:white;font-size:18px;width:120px}</style></head><body><div class="box"><a href="../../">← Back to Game Hub</a><h1>🔢 Number Guess</h1><p>Guess a number from 1–100.</p><input id="guess" type="number" min="1" max="100"><button id="check">Guess</button><p id="msg"></p><button id="new">New Number</button></div><script>let target=Math.floor(Math.random()*100)+1;check.onclick=()=>{let n=Number(guess.value);if(!n)return;msg.textContent=n===target?'🎉 You got it!':n<target?'Too low!':'Too high!'};new.onclick=()=>{target=Math.floor(Math.random()*100)+1;msg.textContent='New number generated!';guess.value=''};</script></body></html>
