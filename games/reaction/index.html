<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>⚡ Reaction Test</title><style>body{margin:0;background:#0d1117;color:#f0f6fc;font-family:Arial;text-align:center;min-height:100vh;display:grid;place-items:center}.box{width:min(600px,90%);background:#161b22;border:1px solid #30363d;border-radius:20px;padding:35px}button{padding:14px 22px;border:0;border-radius:12px;background:#238636;color:white;font-size:18px;cursor:pointer}button:hover{filter:brightness(1.15)}a{color:#58a6ff;text-decoration:none}#arena{height:280px;border-radius:15px;background:#111827;display:grid;place-items:center;cursor:pointer;margin:20px 0}input{padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:white;font-size:18px;width:120px}</style></head><body><div class="box"><a href="../../">← Back to Game Hub</a><h1>⚡ Reaction Test</h1><p id="msg">Press Start, then wait for the box to turn green.</p><button id="start">Start</button><div id="arena">Ready?</div><p id="result"></p></div><script>let timer,started=false,startTime=0;start.onclick=()=>{result.textContent='';arena.textContent='Wait...';arena.style.background='#7f1d1d';started=false;clearTimeout(timer);timer=setTimeout(()=>{started=true;startTime=performance.now();arena.textContent='CLICK!';arena.style.background='#166534'},1000+Math.random()*3000)};arena.onclick=()=>{if(started){result.textContent=Math.round(performance.now()-startTime)+' ms';started=false}else{result.textContent='Wait for green!'}};</script></body></html>
