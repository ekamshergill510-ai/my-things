<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🖱️ Clicker</title><style>body{margin:0;background:#0d1117;color:#f0f6fc;font-family:Arial;text-align:center;min-height:100vh;display:grid;place-items:center}.box{width:min(600px,90%);background:#161b22;border:1px solid #30363d;border-radius:20px;padding:35px}button{padding:14px 22px;border:0;border-radius:12px;background:#238636;color:white;font-size:18px;cursor:pointer}button:hover{filter:brightness(1.15)}a{color:#58a6ff;text-decoration:none}#arena{height:280px;border-radius:15px;background:#111827;display:grid;place-items:center;cursor:pointer;margin:20px 0}input{padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:white;font-size:18px;width:120px}</style></head><body><div class="box"><a href="../../">← Back to Game Hub</a><h1>🖱️ Clicker</h1><p>Clicks: <b id="score">0</b></p><button id="btn">CLICK!</button><p><button id="reset">Reset</button></p></div><script>let n=0;btn.onclick=()=>score.textContent=++n;reset.onclick=()=>{n=0;score.textContent=0};</script></body></html>
