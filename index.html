<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎮 Game Hub</h1>
    <p>Your little corner of games.</p>
    <input id="search" type="search" placeholder="Search games...">
  </header>

  <main id="games">
    <a class="card" href="games/clicker/">
      <div class="emoji">🖱️</div>
      <h2>Clicker</h2>
      <p>See how fast you can click.</p>
    </a>
    <a class="card" href="games/reaction/">
      <div class="emoji">⚡</div>
      <h2>Reaction Test</h2>
      <p>Test your reaction speed.</p>
    </a>
    <a class="card" href="games/guess/">
      <div class="emoji">🔢</div>
      <h2>Number Guess</h2>
      <p>Guess the secret number.</p>
    </a>
  </main>

  <footer>Made with HTML, CSS & JavaScript.</footer>
  <script src="script.js"></script>
</body>
</html>
